[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syougi-rl"
version = "0.1.0"
description = "Small AlphaZero-style shogi reinforcement learning and play GUI"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "python-shogi>=1.1.1",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "PySide6>=6.6",
]

[project.scripts]
syougi-train = "train:main"
syougi-play = "play_gui:run_gui"

[tool.setuptools.packages.find]
include = ["syougi_rl*"]
