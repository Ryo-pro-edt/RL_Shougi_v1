# Short smoke-training defaults. Increase these values for stronger play.
# if train this -> epochs++
device: auto
seed: 7
epochs: 100 
self_play_games: 2
max_moves: 40
mcts_simulations: 64
temperature: 1.0
updates_per_epoch: 2
batch_size: 8
learning_rate: 0.001
replay_capacity: 50000
checkpoint_every: 1
checkpoint_dir: checkpoints
